# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
# CASSIO currently keeps user projects/sounds in the browser, not Active Record.
# Development/test use repo-local SQLite files. Heroku production uses /tmp so
# Rails can boot on an ephemeral dyno without pretending server-side persistence
# exists. Move production to Postgres before adding server-persisted app data.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_PATH", "/tmp/cassio-production.sqlite3") %>
  cache:
    <<: *default
    database: /tmp/cassio-production-cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: /tmp/cassio-production-queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: /tmp/cassio-production-cable.sqlite3
    migrations_paths: db/cable_migrate
