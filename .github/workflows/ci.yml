name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: find app/javascript test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript unit tests
        run: find test/unit -maxdepth 1 -type f -name '*.mjs' -print0 | sort -z | xargs -0 -n1 node

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  browser_loop_record:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare app
        run: bin/rails db:prepare

      - name: Start Rails
        run: |
          bin/rails server -b 127.0.0.1 -p 3000 > /tmp/cassio-rails.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000/up >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/cassio-rails.log
          exit 1

      - name: Exercise REC count-in with live pad and piano input
        env:
          CASSIO_URL: http://127.0.0.1:3000/
          CHROME_BIN: google-chrome
        run: node test/smoke/loop_record_interactive.mjs

      - name: Print Rails log on failure
        if: failure()
        run: cat /tmp/cassio-rails.log || true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github
